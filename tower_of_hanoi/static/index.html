<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f0e7">
  <title>Tower of Hanoi</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f3f0e7;
      --board: #fffdf8;
      --ink: #20332d;
      --muted: #66766d;
      --green: #176b55;
      --green-dark: #104b3d;
      --rust: #c7523c;
      --gold: #d99b38;
      --line: #d7d9cb;
      --shadow: 0 12px 34px rgb(45 61 49 / 9%);
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background-color: var(--paper);
      background-image:
        repeating-linear-gradient(0deg, transparent 0 39px, rgb(41 71 55 / 3%) 40px),
        repeating-linear-gradient(90deg, transparent 0 39px, rgb(41 71 55 / 3%) 40px);
      font-family: "Trebuchet MS", "Gill Sans", sans-serif;
    }

    button, select { font: inherit; }

    .page {
      width: min(1080px, 100%);
      min-height: 100vh;
      margin: 0 auto;
      padding: 28px 36px 34px;
      display: flex;
      flex-direction: column;
    }

    .masthead, .toolbar, .board-wrap, .rules, .status-row {
      animation: settle-in 420ms ease-out both;
    }

    .toolbar { animation-delay: 70ms; }
    .board-wrap { animation-delay: 140ms; }
    .rules { animation-delay: 180ms; }
    .status-row { animation-delay: 220ms; }

    .masthead {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 26px;
    }

    .overline {
      margin: 0 0 7px;
      color: var(--rust);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: "Palatino Linotype", "Book Antiqua", Georgia, serif;
      font-size: 34px;
      font-weight: 600;
      line-height: 1.05;
    }

    .move-count {
      min-width: 104px;
      padding: 10px 0 5px 16px;
      border-left: 1px solid var(--line);
      text-align: right;
    }

    .move-count strong {
      display: block;
      font-family: "Palatino Linotype", "Book Antiqua", Georgia, serif;
      font-size: 27px;
      font-weight: 600;
      line-height: 1;
    }

    .move-count span {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .toolbar {
      min-height: 58px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    .disk-control {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-right: auto;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
    }

    select, .action {
      min-height: 38px;
      border: 1px solid #b8c2b6;
      border-radius: 4px;
      color: var(--ink);
      background: var(--board);
    }

    select { padding: 0 30px 0 11px; }

    .action {
      padding: 0 14px;
      cursor: pointer;
      transition: background-color 140ms ease, border-color 140ms ease, transform 140ms ease;
    }

    .action:hover { border-color: var(--green); background: #f5f8f2; }
    .action:active { transform: translateY(1px); }
    .action:focus-visible, select:focus-visible, .peg:focus-visible {
      outline: 3px solid rgb(217 155 56 / 65%);
      outline-offset: 2px;
    }

    .action-primary {
      border-color: var(--green);
      color: #fffdf8;
      background: var(--green);
    }

    .action-primary:hover { border-color: var(--green-dark); background: var(--green-dark); }

    .board-wrap {
      flex: 1;
      min-height: 420px;
      margin-top: 22px;
      padding: 20px 24px 4px;
      background: var(--board);
      box-shadow: var(--shadow);
    }

    .board {
      position: relative;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      height: 100%;
      min-height: 390px;
      isolation: isolate;
    }

    .ground {
      position: absolute;
      z-index: -1;
      right: 3%;
      bottom: 44px;
      left: 3%;
      height: 11px;
      border-radius: 2px;
      background: #607568;
      box-shadow: 0 5px 0 #d9ded2;
    }

    .peg {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      min-width: 0;
      padding: 0 4px 46px;
      border: 0;
      color: var(--ink);
      background: transparent;
      cursor: pointer;
    }

    .peg::before {
      position: absolute;
      z-index: -1;
      bottom: 54px;
      width: 10px;
      height: min(72%, 310px);
      border-radius: 6px 6px 1px 1px;
      background: #b6c3b5;
      content: "";
      transition: background-color 150ms ease, height 180ms ease;
    }

    .peg.is-selected::before { background: var(--gold); }
    .peg.is-drop-target::before { background: #6eaa83; }

    .stack {
      z-index: 1;
      width: 100%;
      display: flex;
      flex-direction: column-reverse;
      align-items: center;
      margin-bottom: 1px;
    }

    .disk {
      height: 28px;
      flex: 0 0 28px;
      display: grid;
      place-items: center;
      margin-top: 2px;
      border: 1px solid rgb(22 47 39 / 14%);
      border-radius: 5px 5px 3px 3px;
      color: #fffdf8;
      font-size: 12px;
      font-weight: 700;
      box-shadow: inset 0 1px 0 rgb(255 255 255 / 24%);
      animation: disk-arrive 180ms ease-out both;
      cursor: grab;
      touch-action: none;
      user-select: none;
    }

    .disk:active { cursor: grabbing; }
    .disk.is-dragging { opacity: 0.45; }

    .peg-label {
      position: absolute;
      bottom: 11px;
      display: grid;
      width: 32px;
      height: 25px;
      place-items: center;
      border-radius: 3px;
      color: var(--muted);
      font-family: "Palatino Linotype", "Book Antiqua", Georgia, serif;
      font-size: 16px;
      font-weight: 700;
    }

    .peg.is-selected .peg-label { color: var(--green-dark); background: #e7eee5; }

    .status-row {
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding-top: 12px;
    }

    #status {
      margin: 0;
      color: var(--green-dark);
      font-size: 13px;
    }

    .minimum {
      flex: none;
      color: var(--muted);
      font-size: 11px;
    }

    .rules {
      display: grid;
      grid-template-columns: 90px 1fr;
      gap: 12px;
      align-items: baseline;
      padding: 12px 0 2px;
      border-top: 1px solid var(--line);
    }

    .rules h2 {
      margin: 0;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .rules ul {
      display: flex;
      flex-wrap: wrap;
      gap: 5px 24px;
      margin: 0;
      padding-left: 17px;
      color: var(--muted);
      font-size: 12px;
    }

    .rules li::marker { color: var(--rust); }

    @keyframes settle-in {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes disk-arrive {
      from { opacity: 0.65; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 680px) {
      .page { padding: 22px 16px 24px; }
      .masthead { margin-bottom: 18px; }
      .toolbar { flex-wrap: wrap; gap: 8px; }
      .disk-control { width: 100%; margin: 0 0 2px; }
      .action { flex: 1 1 auto; padding: 0 9px; font-size: 12px; }
      .board-wrap { min-height: 380px; margin-top: 16px; padding: 14px 7px 0; }
      .board { min-height: 350px; }
      .ground { right: 1%; left: 1%; bottom: 42px; }
      .peg { padding-right: 1px; padding-left: 1px; }
      .peg::before { width: 8px; }
      .disk { height: 25px; flex-basis: 25px; font-size: 10px; }
      .status-row { align-items: flex-start; flex-direction: column; gap: 5px; }
      .rules { grid-template-columns: 1fr; gap: 6px; }
      .rules ul { display: grid; gap: 5px; }
      h1 { font-size: 30px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="masthead">
      <div>
        <p class="overline">A three-peg puzzle</p>
        <h1>Tower of Hanoi</h1>
      </div>
      <div class="move-count" aria-live="polite">
        <strong id="move-count">0</strong>
        <span>Moves</span>
      </div>
    </header>

    <section class="toolbar" aria-label="Game controls">
      <label class="disk-control" for="disk-count">
        Disks
        <select id="disk-count" aria-label="Number of disks">
          <option>3</option><option selected>4</option><option>5</option>
          <option>6</option><option>7</option><option>8</option>
        </select>
      </label>
      <button class="action" id="new-game" type="button">New game</button>
      <button class="action" id="next-step" type="button">Next step</button>
      <button class="action action-primary" id="solve" type="button">Run solution</button>
    </section>

    <section class="board-wrap" aria-label="Puzzle board">
      <div class="board" id="board" role="group" aria-label="Three pegs">
        <div class="ground" aria-hidden="true"></div>
        <button class="peg" data-peg="A" type="button" aria-label="Peg A">
          <span class="stack"></span><span class="peg-label">A</span>
        </button>
        <button class="peg" data-peg="B" type="button" aria-label="Peg B">
          <span class="stack"></span><span class="peg-label">B</span>
        </button>
        <button class="peg" data-peg="C" type="button" aria-label="Peg C">
          <span class="stack"></span><span class="peg-label">C</span>
        </button>
      </div>
    </section>

    <section class="rules" aria-labelledby="rules-title">
      <h2 id="rules-title">Rules</h2>
      <ul>
        <li>Move one disk at a time.</li>
        <li>Only move the top disk on a peg.</li>
        <li>Never place a larger disk on a smaller disk.</li>
        <li>Move every disk to peg C to win.</li>
      </ul>
    </section>

    <footer class="status-row">
      <p id="status" role="status">Select a peg with a disk.</p>
      <span class="minimum">Minimum moves: <strong id="minimum">15</strong></span>
    </footer>
  </main>

  <script>
    const board = document.querySelector("#board");
    const diskChoice = document.querySelector("#disk-count");
    const moveCount = document.querySelector("#move-count");
    const minimumMoves = document.querySelector("#minimum");
    const statusText = document.querySelector("#status");
    const solveButton = document.querySelector("#solve");
    const colors = ["#bd503d", "#dc9632", "#367c69", "#477ba5", "#82628f", "#b86e4b", "#688047", "#58646e"];
    let gameState;
    let selectedPeg = null;
    let solution = [];
    let solutionIndex = 0;
    let running = false;
    let timer = null;
    let draggedSource = null;

    async function request(path, options = {}) {
      const response = await fetch(path, {
        ...options,
        headers: { "Content-Type": "application/json", ...(options.headers || {}) },
      });
      const result = await response.json();
      if (!response.ok) throw new Error(result.error || "The request could not be completed.");
      return result;
    }

    function render() {
      moveCount.textContent = gameState.move_count;
      diskChoice.value = gameState.disk_count;
      minimumMoves.textContent = (2 ** gameState.disk_count) - 1;
      for (const pegButton of board.querySelectorAll(".peg")) {
        const peg = pegButton.dataset.peg;
        const stack = pegButton.querySelector(".stack");
        pegButton.classList.toggle("is-selected", peg === selectedPeg);
        pegButton.setAttribute("aria-pressed", String(peg === selectedPeg));
        pegButton.setAttribute("aria-label", `Peg ${peg}, ${gameState.pegs[peg].length} disks`);
        const topDisk = gameState.pegs[peg].at(-1);
        stack.replaceChildren(...gameState.pegs[peg].map((disk) => {
          const element = document.createElement("span");
          element.className = "disk";
          element.textContent = disk;
          element.draggable = disk === topDisk && !running;
          element.style.width = `${38 + (disk / gameState.disk_count) * 50}%`;
          element.style.backgroundColor = colors[(disk - 1) % colors.length];
          return element;
        }));
      }
    }

    async function loadState() {
      gameState = await request("/api/state");
      render();
    }

    async function moveDisk(source, destination) {
      gameState = await request("/api/move", {
        method: "POST",
        body: JSON.stringify({ source, destination }),
      });
      render();
    }

    function stopSolution() {
      if (timer !== null) window.clearTimeout(timer);
      timer = null;
      running = false;
      solveButton.textContent = "Run solution";
    }

    async function resetGame() {
      stopSolution();
      try {
        gameState = await request("/api/reset", {
          method: "POST",
          body: JSON.stringify({ disk_count: Number(diskChoice.value) }),
        });
        selectedPeg = null;
        solution = [];
        solutionIndex = 0;
        render();
        statusText.textContent = "Select a peg with a disk.";
      } catch (error) {
        statusText.textContent = error.message;
      }
    }

    async function prepareSolution() {
      if (solution.length > 0 && solutionIndex < solution.length) return;
      if (gameState.move_count > 0) {
        gameState = await request("/api/reset", {
          method: "POST",
          body: JSON.stringify({ disk_count: gameState.disk_count }),
        });
        selectedPeg = null;
        render();
        statusText.textContent = "Solution starts from a fresh board.";
      }
      const result = await request("/api/solution");
      solution = result.moves;
      solutionIndex = 0;
    }

    async function advanceSolution() {
      if (solutionIndex >= solution.length) {
        stopSolution();
        statusText.textContent = "Puzzle solved. Minimum move count reached.";
        return;
      }
      const [source, destination] = solution[solutionIndex];
      await moveDisk(source, destination);
      solutionIndex += 1;
      if (gameState.solved) {
        stopSolution();
        statusText.textContent = "Puzzle solved. Minimum move count reached.";
      } else {
        statusText.textContent = `Solution move ${solutionIndex} of ${solution.length}.`;
        if (running) timer = window.setTimeout(advanceSolution, 430);
      }
    }

    document.querySelector("#new-game").addEventListener("click", resetGame);
    document.querySelector("#next-step").addEventListener("click", async () => {
      if (running) return;
      stopSolution();
      try {
        await prepareSolution();
        await advanceSolution();
      } catch (error) {
        statusText.textContent = error.message;
      }
    });

    solveButton.addEventListener("click", async () => {
      if (running) {
        stopSolution();
        statusText.textContent = "Solution paused.";
        return;
      }
      try {
        await prepareSolution();
        running = true;
        solveButton.textContent = "Pause";
        statusText.textContent = "Running iterative solution.";
        await advanceSolution();
      } catch (error) {
        stopSolution();
        statusText.textContent = error.message;
      }
    });

    diskChoice.addEventListener("change", resetGame);
    async function moveFromTo(source, destination) {
      stopSolution();
      solution = [];
      solutionIndex = 0;
      selectedPeg = null;
      try {
        await moveDisk(source, destination);
        statusText.textContent = gameState.solved
          ? "Puzzle solved. Well done!"
          : `Moved a disk from ${source} to ${destination}.`;
      } catch (error) {
        render();
        statusText.textContent = error.message;
      }
    }

    board.addEventListener("dragstart", (event) => {
      const disk = event.target.closest(".disk");
      if (!disk || !disk.draggable || running) {
        event.preventDefault();
        return;
      }
      draggedSource = disk.closest(".peg").dataset.peg;
      disk.classList.add("is-dragging");
      event.dataTransfer.effectAllowed = "move";
      event.dataTransfer.setData("text/plain", draggedSource);
    });

    board.addEventListener("dragover", (event) => {
      if (draggedSource === null || running) return;
      const target = event.target.closest(".peg");
      if (!target) return;
      event.preventDefault();
      board.querySelectorAll(".is-drop-target").forEach((peg) => peg.classList.remove("is-drop-target"));
      target.classList.add("is-drop-target");
      event.dataTransfer.dropEffect = "move";
    });

    board.addEventListener("drop", async (event) => {
      const target = event.target.closest(".peg");
      if (!target || draggedSource === null || running) return;
      event.preventDefault();
      const source = draggedSource;
      draggedSource = null;
      board.querySelectorAll(".is-drop-target").forEach((peg) => peg.classList.remove("is-drop-target"));
      await moveFromTo(source, target.dataset.peg);
    });

    board.addEventListener("dragend", (event) => {
      draggedSource = null;
      event.target.closest(".disk")?.classList.remove("is-dragging");
      board.querySelectorAll(".is-drop-target").forEach((peg) => peg.classList.remove("is-drop-target"));
    });

    board.addEventListener("click", async (event) => {
      const pegButton = event.target.closest(".peg");
      if (!pegButton || running || gameState.solved) return;
      const peg = pegButton.dataset.peg;
      if (selectedPeg === null) {
        if (gameState.pegs[peg].length === 0) {
          statusText.textContent = `Peg ${peg} has no disk to move.`;
          return;
        }
        selectedPeg = peg;
        render();
        statusText.textContent = `Peg ${peg} selected. Choose a destination.`;
        return;
      }
      if (selectedPeg === peg) {
        selectedPeg = null;
        render();
        statusText.textContent = "Selection cleared.";
        return;
      }
      const source = selectedPeg;
      selectedPeg = null;
      await moveFromTo(source, peg);
    });

    loadState().catch((error) => { statusText.textContent = error.message; });
  </script>
</body>
</html>
